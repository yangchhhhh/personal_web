<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AGX 模型</title>
<style>
  html, body { margin: 0; height: 100%; background: #12151c; color: #e8ecf1; font: 14px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 12px calc(10px); padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: linear-gradient(#12151cee, #12151c00);
  }
  .bar a, .bar button {
    border: 1px solid #3d4a5c; background: #1c2330; color: #e8ecf1;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font: inherit; text-decoration: none;
  }
  .bar button.on { background: #c45c2c; border-color: #e07a4a; }
  .bar b { margin-right: 6px; }
  .hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    color: #9aa6b5; font-size: 12px; pointer-events: none;
  }
  .status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 5; color: #9aa6b5; pointer-events: none;
  }
</style>
</head>
<body>
<div class="bar">
  <a id="home" href="../index.html" hidden>回首页</a>
  <b>AGX 模型</b>
  <button type="button" id="btnExplode">爆炸图</button>
  <button type="button" id="btnReset">重置视角</button>
</div>
<div class="status" id="status">加载模型…</div>
<p class="hint">拖动旋转 · 滚轮缩放 · 点模型或按钮切换爆炸 / 组装</p>
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.1/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.160.1/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  const path = location.pathname.replace(/\\/g, "/");
  const inTools = path.indexOf("/tools/") !== -1;
  const MODEL_URL = inTools ? "../models/agx.glb" : "../refer/agx.glb";
  const home = document.getElementById("home");
  if (inTools) home.hidden = false;

  const status = document.getElementById("status");
  const btnExplode = document.getElementById("btnExplode");
  const btnReset = document.getElementById("btnReset");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x12151c);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 2000);
  camera.position.set(0.4, 0.3, 0.6);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xcfd8e3, 0x2a3038, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.35);
  key.position.set(2, 4, 3);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aacc, 0.45);
  fill.position.set(-3, 1, -2);
  scene.add(fill);

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let modelRoot = null;
  let parts = [];
  let exploded = false;
  let anim = null;
  const EXPLODE = 1.55;

  function setStatus(t) { status.textContent = t || ""; status.style.display = t ? "flex" : "none"; }

  function collectParts(root) {
    const meshes = [];
    root.traverse(function (o) { if (o.isMesh) meshes.push(o); });
    const use = meshes.length > 1 ? meshes : root.children.filter(function (c) { return c !== root; });
    const list = use.length ? use : meshes;
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const out = [];
    list.forEach(function (obj) {
      obj.updateWorldMatrix(true, false);
      const pb = new THREE.Box3().setFromObject(obj);
      const pc = pb.getCenter(new THREE.Vector3());
      let worldOff = pc.sub(center);
      if (worldOff.lengthSq() < 1e-10) {
        worldOff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
      }
      const parent = obj.parent;
      const worldPos = new THREE.Vector3();
      obj.getWorldPosition(worldPos);
      const targetWorld = worldPos.clone().add(worldOff.multiplyScalar(EXPLODE));
      const explodedLocal = parent ? parent.worldToLocal(targetWorld.clone()) : targetWorld.clone();
      out.push({ obj: obj, orig: obj.position.clone(), exploded: explodedLocal });
    });
    return out;
  }

  function fitCamera(obj) {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const c = box.getCenter(new THREE.Vector3());
    const max = Math.max(size.x, size.y, size.z) || 1;
    camera.near = max / 200;
    camera.far = max * 80;
    camera.updateProjectionMatrix();
    camera.position.copy(c).add(new THREE.Vector3(max * 1.2, max * 0.8, max * 1.4));
    controls.target.copy(c);
    controls.update();
  }

  function animateTo(flag) {
    exploded = flag;
    btnExplode.classList.toggle("on", exploded);
    btnExplode.textContent = exploded ? "组装" : "爆炸图";
    const t0 = performance.now();
    const dur = 520;
    const from = parts.map(function (p) { return p.obj.position.clone(); });
    const to = parts.map(function (p) { return exploded ? p.exploded : p.orig; });
    anim = function (now) {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      parts.forEach(function (p, i) { p.obj.position.lerpVectors(from[i], to[i], e); });
      if (k < 1) requestAnimationFrame(anim);
      else anim = null;
    };
    requestAnimationFrame(anim);
  }

  function toggleExplode() {
    if (parts.length < 2) {
      setStatus("这个模型只有一块网格，没法拆成爆炸图。");
      setTimeout(function () { setStatus(""); }, 2200);
      return;
    }
    animateTo(!exploded);
  }

  const loader = new THREE.GLTFLoader();
  loader.load(MODEL_URL, function (gltf) {
    modelRoot = gltf.scene;
    scene.add(modelRoot);
    parts = collectParts(modelRoot);
    fitCamera(modelRoot);
    setStatus("");
    if (parts.length < 2) btnExplode.title = "模型未分成多块零件";
  }, function (ev) {
    if (ev.total) setStatus("加载 " + Math.round(ev.loaded / ev.total * 100) + "%");
  }, function (err) {
    setStatus("模型加载失败。若用 file:// 打开，请在本文件夹运行 py -m http.server 后再访问。");
    console.error(err);
  });

  let ptrDown = null;
  renderer.domElement.addEventListener("pointerdown", function (e) {
    ptrDown = { x: e.clientX, y: e.clientY };
  });
  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!ptrDown || !modelRoot) return;
    const dx = e.clientX - ptrDown.x, dy = e.clientY - ptrDown.y;
    ptrDown = null;
    if (dx * dx + dy * dy > 25) return;
    pointer.x = (e.clientX / innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(modelRoot, true);
    if (hits.length) toggleExplode();
  });
  btnExplode.addEventListener("click", toggleExplode);
  btnReset.addEventListener("click", function () {
    if (modelRoot) fitCamera(modelRoot);
  });
  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
